name: scrape

on:
  workflow_dispatch:      # dipanggil oleh Apps Script (kickScraper)

concurrency:
  group: scraper          # hanya 1 run berjalan; sisanya antre
  cancel-in-progress: false

jobs:
  run:
    # Default: server GitHub (IP datacenter, lebih mudah diblokir Google Maps).
    # Bila diblokir terus: pasang self-hosted runner di laptop/PC kantor (IP biasa), lalu isi
    # GitHub > Settings > Secrets and variables > Actions > tab Variables > RUNNER_LABEL = self-hosted
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
      - name: Install Chromium (server GitHub)
        if: ${{ runner.environment == 'github-hosted' }}
        run: playwright install --with-deps chromium
      - name: Install Chromium (self-hosted)
        if: ${{ runner.environment != 'github-hosted' }}
        run: playwright install chromium
      - run: python worker.py
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PIN_BASE_URL: ${{ secrets.PIN_BASE_URL }}
          LOG_URL: ${{ secrets.LOG_URL }}        # penampung scraping (LogScrape.gs); tanpa ini foto TIDAK diambil dan log tidak tercatat
          LOG_TOKEN: ${{ secrets.LOG_TOKEN }}
